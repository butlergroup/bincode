[package]
name = "bincode_reloaded_compatibility"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "a crate to enable backward compatibility/tests for bincode_reloaded"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode_2 = { version = "2.0.1", package = "bincode_reloaded", features = ["serde"] }
bincode_1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"

[package]
name = "bincode_reloaded-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"
repository = "https://github.com/butlergroup/bincode_reloaded"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
bincodev1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0.228", features = ["derive"] }

[dependencies.bincode_reloaded]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "compat"
path = "fuzz_targets/compat.rs"
test = false
doc = false

[package]
name = "bincode_reloaded-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
bincode_reloaded = { path = ".." }      # matches the crate name in ../Cargo.toml
bincodev1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0.228", features = ["derive"] }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "compat"
path = "fuzz_targets/compat.rs"
test = false
doc = false

[workspace]
members = ["derive", "compatibility"]

[package]
name = "bincode_reloaded"
version = "3.1.15" # remember to update html_root_url and bincode_derive x 2 (below)
authors = [
    "Ty Overby <ty@pre-alpha.com>",
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
    "Chris Butler <chris.butler@butlergroup.net>",
]
exclude = ["logo.svg", "examples/*", ".gitignore", ".github/"]
rust-version = "1.86.0"

publish = true

repository = "https://github.com/butlergroup/bincode_reloaded"
documentation = "https://docs.rs/bincode_reloaded"
readme = "./README.md"
categories = ["encoding", "data-structures", "development-tools", "parsing"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

license = "MIT"
description = "A binary serialization / deserialization strategy for transforming structs into bytes and vice versa! Maintained, drop-in replacement for bincode."

edition = "2024"

[features]
default = ["std", "derive"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
derive = ["bincode_reloaded_derive"]

[dependencies]
bincode_reloaded_derive = { path = "./derive", version = "3.1.15", optional = true }
serde = { version = "1.0.229", default-features = false, optional = true }
unty = "0.0.5"

# Used for tests
[dev-dependencies]
ouroboros = "0.18.5"
serde_derive = "1.0.229"
serde_json = { version = "1.0.151", default-features = false }
tempfile = "3.27.0"
criterion = "0.8.2"
rand = "0.10.2"
uuid = { version = "1.24.0", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
glam = { version = "0.33.2", features = ["serde"] }
bincode_1 = { version = "1.3.3", package = "bincode" }
serde = { version = "1.0.229", features = ["derive"] }
bumpalo = { version = "3.20.3", features = ["collections"] }

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "inline"
harness = false

[[bench]]
name = "string"
harness = false

[profile.bench]
codegen-units = 1
debug = 1
lto = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

{
  "name": "CI",
  "permissions": { contents: read },
  "on":
    {
      "push": { "branches": ["main", "v*.x", "ci/*"] },
      "pull_request": { "branches": ["main", "v*.x"] },
    },
  "concurrency":
    {
      "group": "${{ github.workflow }}-${{ github.ref }}",
      "cancel-in-progress": true,
    },
  "jobs":
    {
      "check":
        {
          "name": "Check",
          "runs-on": "${{ matrix.runner }}",
          "strategy":
            {
              "fail-fast": false,
              "matrix":
                {
                  "runner": ["ubuntu-latest", "windows-latest", "macos-latest"],
                  "rust": ["stable", "beta", "nightly", "1.86.0"],
                },
            },
          "steps":
            [
              { "uses": "actions/checkout@v6", "name": "Checkout" },
              {
                "uses": "actions-rs/toolchain@v1",
                "with":
                  {
                    "profile": "minimal",
                    "toolchain": "${{ matrix.rust }}",
                    "override": true,
                  },
                "name": "Install Rust ${{ matrix.rust }}",
              },
              {
                "uses": "actions-rs/cargo@v1",
                "with": { "command": "check", "args": "--all-features" },
                "name": "Run `cargo check`",
              },
              {
                "uses": "actions-rs/cargo@v1",
                "with": { "command": "check", "args": "--bench *" },
                "name": "Run `cargo check` on benches",
              },
              {
                "uses": "actions-rs/cargo@v1",
                "with": { "command": "check", "args": "--examples" },
                "name": "Check examples",
              },
            ],
        },
      "test":
        {
          "name": "Test",
          "strategy":
            {
              "matrix":
                {
                  "runner": ["ubuntu-latest", "windows-latest", "macos-latest"],
                  "rust": ["stable", "beta", "nightly", "1.86.0"],
                  "features":
                    [
                      "",
                      "alloc",
                      "alloc,derive",
                      "std",
                      "std,derive",
                      "serde",
                      "alloc,serde",
                      "std,serde",
                      "serde,derive",
                      "alloc,serde,derive",
                      "std,serde,derive",
                    ],
                },
            },
          "runs-on": "${{ matrix.runner }}",
          "steps":
            [
              { "uses": "actions/checkout@v6", "name": "Checkout" },
              {
                "uses": "actions-rs/toolchain@v1",
                "with":
                  {
                    "profile": "minimal",
                    "toolchain": "${{ matrix.rust }}",
                    "override": true,
                  },
                "name": "Install Rust ${{ matrix.rust }}",
              },
              { "run": "if [ -z \"${{ matrix.features }}\" ]\n
                  then\n
                  cargo test --no-default-features\n
                  else\n
                  cargo test --no-default-features --features ${{ matrix.features }}\n
                  fi", "name": "Run `cargo test` on all features", "shell": "bash", "env": { "RUSTFLAGS": "-D warnings" } },
            ],
        },
      "compatibility":
        {
          "name": "Compatibility",
          "runs-on": "ubuntu-latest",
          "steps":
            [
              { "uses": "actions/checkout@v6", "name": "Checkout" },
              {
                "uses": "actions-rs/toolchain@v1",
                "with":
                  {
                    "profile": "minimal",
                    "toolchain": "1.86.0",
                    "override": true,
                  },
                "name": "Install Rust stable",
              },
              {
                "uses": "actions-rs/cargo@v1",
                "with":
                  {
                    "command": "test",
                    "args": "--manifest-path compatibility/Cargo.toml",
                  },
                "name": "Run compatibility tests",
              },
            ],
        },
      "coverage":
        {
          "runs-on": "ubuntu-latest",
          "env":
            {
              "RUSTFLAGS": "-Cinstrument-coverage -Clink-dead-code -Coverflow-checks=off",
              "LLVM_PROFILE_FILE": "coverage/%p-%m.profraw",
            },
          "steps":
            [
              { "uses": "actions/checkout@v4" },
              {
                "name": "Set up Rust with coverage tools",
                "uses": "actions-rs/toolchain@v1",
                "with":
                  {
                    "toolchain": "stable",
                    "override": true,
                    "components": "llvm-tools-preview",
                  },
              },
              {
                "name": "Install grcov",
                "run": "curl -LsSf https://github.com/mozilla/grcov/releases/download/v0.8.19/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar xj\nsudo mv grcov /usr/local/bin/",
              },
              {
                "name": "Run tests with coverage",
                "run": "cargo clean\ncargo build --tests\ncargo test",
              },
              {
                "name": "Generate coverage report",
                "run": "mkdir -p coverage\ngrcov . \\\n  --binary-path ./target/debug/ \\\n  --source-dir . \\\n  --output-type lcov \\\n  --branch \\\n  --ignore-not-existing \\\n  --ignore \"/*/.cargo/**\" \\\n  --ignore \"target/**\" \\\n  --output-path coverage/lcov.info",
              },
              {
                "name": "Coveralls GitHub Action",
                "uses": "coverallsapp/github-action@v2.3.6",
                "env":
                  {
                    "COVERALLS_REPO_TOKEN": "${{ secrets.COVERALLS_REPO_TOKEN }}",
                  },
                "with": { "path-to-lcov": "coverage/lcov.info" },
              },
            ],
        },
    },
}
